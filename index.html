<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PixelForge | Private Image Tools</title>

    <meta
      name="description"
      content="Compress, resize, convert, crop and optimize images directly in your browser. Your images never leave your device."
    />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161310" />

    <link rel="icon" href="icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PixelForge | Private Image Tools" />

    <meta
      property="og:description"
      content="Compress, resize, convert, crop and optimize images directly in your browser. Your images never leave your device."
    />

    <meta
      property="og:image"
      content="https://hassanfoundry.github.io/PixelForge/og-image.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('pixelforge-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {}
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
